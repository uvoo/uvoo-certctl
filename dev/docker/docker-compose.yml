services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.1
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: 8080
    ports:
      - "${KEYCLOAK_HOST_PORT:-18080}:8080"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro

  uvoocertctl:
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        VERSION: docker-dev
        COMMIT: docker-dev
        BUILD_DATE: docker-dev
    depends_on:
      - keycloak
    environment:
      CERTCTL_CSR_SUBMIT_PASSWORD: submit-secret
      CERTCTL_ADMIN_PASSWORD: admin-secret
      CERTCTL_METRICS_PASSWORD: metrics-secret
    ports:
      - "${CERTCTL_HOST_PORT:-18081}:8080"
    volumes:
      - uvoocertctl-data:/data
    command:
      - serve-certs
      - --db
      - /data/certs.db
      - --listen
      - :8080
      - --nacl
      - 0.0.0.0/0,::/0
      - --csr-submit-password
      - env:CERTCTL_CSR_SUBMIT_PASSWORD
      - --admin-username
      - "${CERTCTL_ADMIN_USERNAME:-admin}"
      - --admin-password
      - env:CERTCTL_ADMIN_PASSWORD
      - --admin-warn-days
      - "0"
      - --metrics
      - --metrics-username
      - "${CERTCTL_METRICS_USERNAME:-metrics}"
      - --metrics-password
      - env:CERTCTL_METRICS_PASSWORD

volumes:
  uvoocertctl-data:
